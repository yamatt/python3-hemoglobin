name: Publish Hemoglobin

on:
  push:
    tags:
      - "v*" # Triggers on v1.0.0, v2.1.3, etc.

jobs:
  publish:
    name: Build and Release
    runs-on: ubuntu-latest

    # Trusted Publishing requires these specific permissions
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: "auto"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Build Package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
